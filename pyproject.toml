[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retinaai"
version = "0.1.0"
description = "RetinaAI Triage: research prototype for diabetic retinopathy screening support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
train = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
